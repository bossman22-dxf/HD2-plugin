name: Manual Stratagem Asset Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-stratagem-asset-update
  cancel-in-progress: false

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies for icon generation
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Install updater dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r update/requirements.txt

      - name: Discover missing stratagem mappings
        run: |
          . .venv/bin/activate
          python -m update discover -v

      - name: Regenerate stratagem assets
        run: |
          . .venv/bin/activate
          python -m update generate-all --skip-pages -v

      - name: Validate generated assets
        run: |
          . .venv/bin/activate
          python -m update validate

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/config.py assets/data/stratagems.json assets/icons locales
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update discovered stratagem assets"
            git push origin HEAD:main
          fi
